services:
  - type: n8n_service
    runtime: image
    plan: free
    image: 
    url: docker.io/n8nio/n8n:latest
   envVars:
    - key: N8N_ENCRYPTION_KEY
      generatevalue: true
      value: postgresdb
    - key: DB_POSTGRESDB_DATABASE
      fromDatabase:
        name: n8n-db
        property: host
    - key: DB_POSTGESDB_PASSWORD
      fromDatabase:
        name: n8n-db
        property: user
databases:
     - name: n8n-db 
       plan: free
      
