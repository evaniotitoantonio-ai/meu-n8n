services:
  - type: web
    name: meu-n8n
    runtime: image
    image: 
      url: docker.n8n.io/n8nio/n8n:latest
    plan: free
    envVars:
      - key: N8N_PORT
        value: "10000
      - key: N8N_PROTOCOL
        value: https
      - key: WEBHOOK_URL
        value: https://meu-n8n.onrender.com/
      - key: N8N_ENCRYPTION_KEY
        generateValue: true
      - key: N8N_SECURE_COOKIE
        value: "true
